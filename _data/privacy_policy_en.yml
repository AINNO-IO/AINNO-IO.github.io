title: 'Privacy policy'
lead: 'A short overview of how we handle your data when you use ainno.io.'

sections:
  - heading: 'Data controller'
    body: 'MB AI Sprendimai (brand name AINNO), Vilnius, Lithuania. Questions: info@ainno.io.'
  - heading: 'What data we collect'
    body: 'Through the contact form: your name, phone number, email address and the content of your message – so that we can reply to your enquiry and offer an analysis or MVP.'
  - heading: 'Legal basis'
    body: 'We process the data to reply to your enquiry and to take steps at your request before entering into a contract (Article 6(1)(b) GDPR), and on the basis of our legitimate business interest in keeping in touch (Article 6(1)(f) GDPR).'
  - heading: 'Contact form service provider'
    body: 'Contact form enquiries are delivered to us by Web3Forms (Web3Creative, India), which acts as a data processor on our behalf. Enquiries are sent over an encrypted connection (HTTPS) and stored on Amazon Web Services, Cloudflare and Hetzner infrastructure for no longer than 3 years, after which they are deleted automatically. To prevent spam, your IP address and email address may be checked with the CleanTalk and Akismet services. Data may be transferred outside the European Economic Area; in that case the Standard Contractual Clauses approved by the European Commission apply. More information: <a href="https://web3forms.com/privacy">Web3Forms privacy policy</a>.'
  - heading: 'How the website works'
    body: 'The website is hosted on GitHub Pages (GitHub, USA) and its fonts are loaded from Google Fonts (Google), so these services – like any web server – receive your IP address and browser information. The website uses no cookies and no visitor analytics. If you choose a site language (LT / EN), that choice is stored only in your browser.'
  - heading: 'Retention'
    body: 'We keep enquiries for as long as needed for communication and project administration, and no longer than necessary, unless the law requires otherwise.'
  - heading: 'Your rights'
    body: 'You have the right to access your data, to request its correction or deletion, to restrict processing, to object to processing, and to lodge a complaint with a supervisory authority (in Lithuania, the State Data Protection Inspectorate). Contact us at info@ainno.io.'
  - heading: 'Changes'
    body: 'We may update this policy. The date of the latest update is shown at the bottom of this page.'
