title: 'Privatumo politika'
lead: 'Trumpai apie tai, kaip tvarkome jūsų duomenis, kai naudojatės ainno.io.'

sections:
  - heading: 'Valdytojas'
    body: 'MB AI Sprendimai (prekės ženklas AINNO). Klausimai: info@ainno.io.'
  - heading: 'Kokius duomenis renkame'
    body: 'Kontaktų formoje: vardas, telefono numeris, el. paštas, žinutės turinys – kad atsakytume į užklausą ir pasiūlytume analizę / MVP.'
  - heading: 'Teisinis pagrindas'
    body: 'Tvarkome duomenis siekdami atsakyti į užklausą ir vykdyti prieškontraktinius veiksmus (BDAR 6 str. 1 d. b punktas) bei teisėtas verslo interesas palaikyti ryšį (BDAR 6 str. 1 d. f punktas).'
  - heading: 'Kontaktų formos paslaugų teikėjas'
    body: 'Kontaktų formos užklausas mums pristato Web3Forms (Web3Creative, Indija), kuris veikia kaip duomenų tvarkytojas mūsų vardu. Užklausos perduodamos šifruotu ryšiu (HTTPS) ir saugomos Amazon Web Services, Cloudflare ir Hetzner infrastruktūroje ne ilgiau nei 3 metus, po to automatiškai ištrinamos. Apsaugai nuo šlamšto jūsų IP adresas ir el. pašto adresas gali būti patikrinti CleanTalk ir Akismet paslaugose. Duomenys gali būti perduodami už Europos ekonominės erdvės ribų – tokiu atveju taikomos Europos Komisijos patvirtintos standartinės sutarčių sąlygos. Daugiau: <a href="https://web3forms.com/privacy">Web3Forms privatumo politika</a>.'
  - heading: 'Svetainės veikimas'
    body: 'Svetainė talpinama GitHub Pages (GitHub, JAV), o šriftai įkeliami iš Google Fonts (Google), todėl šios paslaugos, kaip ir bet kuris interneto serveris, gauna jūsų IP adresą ir naršyklės informaciją. Svetainė nenaudoja slapukų ir lankytojų analitikos. Jei pasirenkate svetainės kalbą (LT / EN), šis pasirinkimas išsaugomas tik jūsų naršyklėje.'
  - heading: 'Saugojimas'
    body: 'Užklausas saugome tiek, kiek reikia komunikacijai ir projektų administravimui, ne ilgiau nei būtina, nebent įstatymai numato kitaip.'
  - heading: 'Jūsų teisės'
    body: 'Turite teisę susipažinti su duomenimis, reikalauti pataisymo ar ištrynimo, apriboti tvarkymą, nesutikti su tvarkymu, teikti skundą priežiūros institucijai (Valstybinei duomenų apsaugos inspekcijai). Kreipkitės info@ainno.io.'
  - heading: 'Pakeitimai'
    body: 'Politiką galime atnaujinti. Paskutinio atnaujinimo data nurodyta puslapio pabaigoje.'
